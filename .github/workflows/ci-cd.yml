name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY_NAME: myflaskregistry
  APP_NAME: simple-flask-app
  RESOURCE_GROUP: simple-flask-rg

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    
    - name: Run tests
      run: |
        # Tests basiques de l'application
        python -c "
        import app
        import requests
        import time
        import subprocess
        import signal
        import os
        
        # Démarrer l'application en arrière-plan
        proc = subprocess.Popen(['python', 'app.py'])
        time.sleep(5)  # Attendre que l'application démarre
        
        try:
            # Test des endpoints
            response = requests.get('http://localhost:5000/health')
            assert response.status_code == 200
            print('✅ Health check passed')
            
            response = requests.get('http://localhost:5000/')
            assert response.status_code == 200
            print('✅ Home page accessible')
            
            response = requests.get('http://localhost:5000/api/time')
            assert response.status_code == 200
            print('✅ API endpoint accessible')
            
        finally:
            # Arrêter l'application
            proc.terminate()
            proc.wait()
        "

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY_NAME }}.azurecr.io
        username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
        password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.production
        push: true
        tags: |
          ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.APP_NAME }}:latest
          ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.APP_NAME }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-to-aci:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Deploy to Azure Container Instances
      run: |
        az container create \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.APP_NAME }}-aci \
          --image ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.APP_NAME }}:${{ github.sha }} \
          --registry-login-server ${{ env.REGISTRY_NAME }}.azurecr.io \
          --registry-username ${{ secrets.AZURE_REGISTRY_USERNAME }} \
          --registry-password ${{ secrets.AZURE_REGISTRY_PASSWORD }} \
          --dns-name-label ${{ env.APP_NAME }}-prod \
          --ports 5000 \
          --cpu 1 \
          --memory 1 \
          --restart-policy Always \
          --environment-variables FLASK_ENV=production
    
    - name: Get application URL
      run: |
        PUBLIC_URL=$(az container show \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.APP_NAME }}-aci \
          --query ipAddress.fqdn \
          --output tsv)
        echo "🌐 Application URL: http://$PUBLIC_URL:5000"
        echo "APPLICATION_URL=http://$PUBLIC_URL:5000" >> $GITHUB_ENV

  health-check:
    needs: deploy-to-aci
    runs-on: ubuntu-latest
    
    steps:
    - name: Wait for deployment
      run: sleep 30
      
    - name: Health check
      run: |
        # Récupérer l'URL de l'application
        PUBLIC_URL=$(az container show \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.APP_NAME }}-aci \
          --query ipAddress.fqdn \
          --output tsv)
        
        # Test de santé
        curl -f http://$PUBLIC_URL:5000/health || exit 1
        echo "✅ Application déployée et opérationnelle"