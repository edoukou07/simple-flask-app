{% extends "base.html" %}

{% block title %}Page non trouvée - Simple Flask App{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto text-center">
        <h1 class="display-1 text-muted">404</h1>
        <h2>Page non trouvée</h2>
        <p class="lead">Désolé, la page que vous recherchez n'existe pas.</p>
        
        <div class="mt-4">
            <a href="{{ url_for('index') }}" class="btn btn-primary">Retour à l'accueil</a>
            <button onclick="history.back()" class="btn btn-outline-secondary">Page précédente</button>
        </div>

        <div class="mt-4">
            <p class="text-muted">
                Si vous pensez qu'il s'agit d'une erreur, 
                <a href="{{ url_for('contact') }}">contactez-nous</a>.
            </p>
        </div>
    </div>
</div>
{% endblock %}
