version: '3.8'

services:
  simple-flask-app:
    build: .
    container_name: simple-flask-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - flask-network

  # Service nginx optionnel pour la production (reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: simple-flask-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - simple-flask-app
    restart: unless-stopped
    networks:
      - flask-network
    profiles:
      - production

networks:
  flask-network:
    driver: bridge